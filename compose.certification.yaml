x-ministack-environment: &ministack-environment
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://ministack:4566
  AWS_FISCAL_DDB_TABLE: business-app-sii-fiscal
  AWS_FISCAL_DDB_ENDPOINT: http://ministack:4566
  AWS_FISCAL_S3_BUCKET: business-app-sii-fiscal
  AWS_FISCAL_S3_ENDPOINT: http://ministack:4566
  AWS_FISCAL_S3_PREFIX: fiscal-custody
  AWS_FISCAL_S3_FORCE_PATH_STYLE: 'true'
  AWS_FISCAL_SSM_ENDPOINT: http://ministack:4566
  AWS_FISCAL_SSM_PREFIX: /business-app-sii/fiscal

x-certification-environment: &certification-environment
  <<: *ministack-environment
  NODE_ENV: test
  API_KEY_FRONTEND: local-certification-key
  REAL_SII_TEST_ENVIRONMENT: CERTIFICACION
  REAL_SII_TEST_RUT_EMISOR: ${SII_CERT_RUT_EMISOR:?Define SII_CERT_RUT_EMISOR in .env}
  REAL_SII_TEST_RUT_FIRMANTE: ${SII_CERT_RUT_FIRMANTE:?Define SII_CERT_RUT_FIRMANTE in .env}
  REAL_SII_TEST_FECHA_RESOLUCION: ${SII_CERT_FECHA_RESOLUCION:?Define SII_CERT_FECHA_RESOLUCION in .env}
  REAL_SII_TEST_NRO_RESOLUCION: ${SII_CERT_NRO_RESOLUCION:?Define SII_CERT_NRO_RESOLUCION in .env}
  REAL_SII_TEST_PFX_PATH: /run/secrets/sii_pfx
  REAL_SII_TEST_PFX_PASSWORD_FILE: /run/secrets/sii_pfx_password
  REAL_SII_TEST_STATUS_SETTLE_MS: ${SII_CERT_STATUS_SETTLE_MS:-5000}
  REAL_SII_TEST_STATUS_POLL_TIMEOUT_MS: ${SII_CERT_POLL_TIMEOUT_MS:-120000}
  REAL_SII_TEST_STATUS_POLL_INTERVAL_MS: ${SII_CERT_POLL_INTERVAL_MS:-10000}
  REAL_SII_TEST_FACTURA33_TENANT_ID: ${SII_CERT_FACTURA33_TENANT_ID:-certification-factura33}
  REAL_SII_TEST_TENANT_ID: ${SII_CERT_BOLETA39_TENANT_ID:-certification-boleta39}
  SII_PORTAL_CAF_AUTOMATION_ENABLED: 'true'
  SII_PORTAL_HTTP_SCRAPING_ENABLED: 'true'
  SII_PORTAL_PLAYWRIGHT_FALLBACK_ENABLED: 'true'
  SII_PORTAL_CERT_LOGIN_ENABLED: 'true'
  SII_PORTAL_HEADLESS: 'true'
  SII_PORTAL_PROGRESS_LOG_ENABLED: 'true'
  SII_XSD_VALIDATION_ENABLED: 'true'

x-existing-caf-environment: &existing-caf-environment
  <<: *certification-environment
  REAL_SII_TEST_SKIP_CAF_REQUEST: 'true'

x-acceptance-service: &acceptance-service
  image: business-app-sii-acceptance:${APP_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: business-app-sii/Dockerfile
    target: acceptance
  environment: *certification-environment
  depends_on:
    ministack-init:
      condition: service_completed_successfully
  secrets:
    - sii_pfx
    - sii_pfx_password
  volumes:
    - ${SII_TEST_ARTIFACTS_DIR:-./secure/real-sii-tests/artifacts}:/workspace/business-app-sii/secure/real-sii-tests/artifacts
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  shm_size: 1gb
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  app:
    profiles:
      - production

  ministack:
    image: business-app-sii-ministack:1.3.54
    build:
      context: .
      dockerfile: docker/ministack/Dockerfile
      args:
        MINISTACK_VERSION: 1.3.54
    environment:
      MINISTACK_REGION: us-east-1
      PERSIST_STATE: '1'
      STATE_DIR: /var/lib/ministack
    volumes:
      - ministack-state:/var/lib/ministack
    read_only: true
    tmpfs:
      - /tmp/ministack:size=128m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    stop_grace_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ministack-init:
    image: business-app-sii-acceptance:${APP_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: business-app-sii/Dockerfile
      target: acceptance
    command:
      - node
      - scripts/ministack/bootstrap.cjs
    environment: *ministack-environment
    depends_on:
      ministack:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  emit-dte:
    <<: *acceptance-service
    environment: *existing-caf-environment
    command:
      - node
      - --experimental-vm-modules
      - node_modules/jest/bin/jest.js
      - --config
      - ./test/jest-smoke.json
      - --runInBand
      - ./test/fiscal-real-sii-dte.smoke-spec.ts

  emit-factura33:
    <<: *acceptance-service
    environment: *existing-caf-environment
    command:
      - node
      - --experimental-vm-modules
      - node_modules/jest/bin/jest.js
      - --config
      - ./test/jest-smoke.json
      - --runInBand
      - ./test/fiscal-real-sii-factura33.smoke-spec.ts

  emit-boleta39:
    <<: *acceptance-service
    environment: *existing-caf-environment
    command:
      - node
      - --experimental-vm-modules
      - node_modules/jest/bin/jest.js
      - --config
      - ./test/jest-smoke.json
      - --runInBand
      - ./test/fiscal-real-sii.smoke-spec.ts

  caf-acquisition:
    <<: *acceptance-service
    command:
      - node
      - --experimental-vm-modules
      - node_modules/jest/bin/jest.js
      - --config
      - ./test/jest-smoke.json
      - --runInBand
      - --verbose
      - ./test/fiscal-real-sii-caf.smoke-spec.ts

  caf-check:
    <<: *acceptance-service
    command:
      - node
      - --experimental-vm-modules
      - node_modules/jest/bin/jest.js
      - --config
      - ./test/jest-smoke.json
      - --runInBand
      - --verbose
      - ./test/fiscal-real-sii-caf-check.smoke-spec.ts

  custody-test:
    image: business-app-sii-acceptance:${APP_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: business-app-sii/Dockerfile
      target: acceptance
    command:
      - node
      - --experimental-vm-modules
      - node_modules/jest/bin/jest.js
      - --config
      - ./test/jest-smoke.json
      - --runInBand
      - ./test/fiscal-ministack-custody.smoke-spec.ts
    environment: *ministack-environment
    depends_on:
      ministack-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ministack-state:

secrets:
  sii_pfx:
    file: ${SII_PFX_FILE:-./secrets/certificado.pfx}
  sii_pfx_password:
    file: ${SII_PFX_PASSWORD_FILE:-./secrets/pfx-password.txt}
